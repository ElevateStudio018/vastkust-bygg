name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/happy-wright-lhp01u]
  workflow_dispatch:
  # Every six hours: picks up new reviews on ServiceFinder and Google (scripts/fetch-reviews.ts) and anything
  # published in the admin that has not been built yet.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The site's Supabase project (public values, row level security protects the data). Repository variables
          # (Settings → Secrets and variables → Actions → Variables) override the project ref eeasibbhydlpoaomjwsn.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://eeasibbhydlpoaomjwsn.supabase.co' }}
          # Google reviews through SerpApi (SETUP.md, step 5). Pushes do not fetch them; the scheduled builds (four a
          # day) and the ones started by hand do, well inside the free 250 a month. The rest keep the saved ones.
          SERPAPI_KEY: ${{ github.event_name != 'push' && secrets.SERPAPI_KEY || '' }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlYXNpYmJoeWRscG9hb21qd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTc5NzYsImV4cCI6MjEwNzczMzk3Nn0.sDuvaPniIlfhnidcC2wICdKsVK09ssDtYgQEwHTQtok' }}
      # Keeps the reviews fetched in this build, so the list grows past the few each site shows at a time.
      - name: Save new reviews
        run: |
          if ! git diff --quiet -- content/reviews.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update reviews from ServiceFinder and Google" -- content/reviews.json
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" || echo "Could not save the reviews; the next build fetches them again."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
