name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/happy-wright-lhp01u]
  workflow_dispatch:
  # Every six hours: picks up new reviews on ServiceFinder and Google (scripts/fetch-reviews.ts) and anything
  # published in the admin that has not been built yet.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Preview until launch: without a domain the site is built for elevatestudio018.github.io/vastkust-bygg, where the
          # admin panel works too. At launch, set the repository variable SITE_DOMAIN to vastkustbygg.se (and the same
          # domain under Settings → Pages) once the domain's DNS points to GitHub Pages. See LANSERING.md.
          CUSTOM_DOMAIN: ${{ vars.SITE_DOMAIN || '' }}
          # The content comes from content/site.json, which the admin panel commits; no database.
          # Google reviews through SerpApi (SETUP.md, step 5). Pushes do not fetch them; the scheduled builds (four a
          # day) and the ones started by hand do, well inside the free 250 a month. The rest keep the saved ones.
          SERPAPI_KEY: ${{ github.event_name != 'push' && secrets.SERPAPI_KEY || '' }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # Keeps the reviews fetched in this build, so the list grows past the few each site shows at a time.
      - name: Save new reviews
        run: |
          if ! git diff --quiet -- content/reviews.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update reviews from ServiceFinder and Google" -- content/reviews.json
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" || echo "Could not save the reviews; the next build fetches them again."
          fi
      # GitHub takes the domain from the repository's Pages settings when publishing with Actions; the CNAME file in
      # the published site states the same, so the build output says where it belongs (only once a domain is set).
      - name: Domain file
        if: ${{ vars.SITE_DOMAIN != '' }}
        run: echo "${{ vars.SITE_DOMAIN }}" > out/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
