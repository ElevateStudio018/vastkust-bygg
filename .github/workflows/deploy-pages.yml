name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/happy-wright-lhp01u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The site's Supabase project (public values, row level security protects the data). Repository variables
          # (Settings → Secrets and variables → Actions → Variables) override the project ref eeasibbhydlpoaomjwsn.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://eeasibbhydlpoaomjwsn.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlYXNpYmJoeWRscG9hb21qd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTc5NzYsImV4cCI6MjEwNzczMzk3Nn0.sDuvaPniIlfhnidcC2wICdKsVK09ssDtYgQEwHTQtok' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
